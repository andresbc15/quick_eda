[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quick_eda"
version = "0.1.0"
description = "Simple, readable exploratory data analysis helpers, inspired by Storytelling with Data."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Andres Cojuangco" }]
dependencies = ["pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
